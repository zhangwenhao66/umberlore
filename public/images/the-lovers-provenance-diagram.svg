<svg viewBox="0 0 1200 560" width="1200" height="560" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1200" height="560" fill="#f7f4ef"/>
  <text x="600" y="46" text-anchor="middle" font-size="24" fill="#2f2a3a" font-weight="bold">Two Canvases Called "The Lovers," Two Different Paper Trails</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#5a5266">Both painted by Magritte in Paris, 1928. Documented ownership since.</text>

  <!-- Track labels -->
  <text x="70" y="150" font-size="15" fill="#2f2a3a" font-weight="bold">MoMA, New York</text>
  <text x="70" y="168" font-size="12" fill="#5a5266">(couple facing each other)</text>
  <line x1="220" y1="180" x2="1140" y2="180" stroke="#8a5a7a" stroke-width="4"/>

  <!-- MoMA track nodes -->
  <circle cx="250" cy="180" r="9" fill="#8a5a7a"/>
  <text x="250" y="205" text-anchor="middle" font-size="12" fill="#2f2a3a" font-weight="bold">1928</text>
  <text x="250" y="220" text-anchor="middle" font-size="11" fill="#5a5266">Painted, Paris</text>

  <circle cx="430" cy="180" r="9" fill="#a06f92"/>
  <text x="430" y="205" text-anchor="middle" font-size="12" fill="#2f2a3a" font-weight="bold">1953</text>
  <text x="430" y="220" text-anchor="middle" font-size="11" fill="#5a5266">First documented</text>
  <text x="430" y="234" text-anchor="middle" font-size="11" fill="#5a5266">owner: Jean Bastien,</text>
  <text x="430" y="248" text-anchor="middle" font-size="11" fill="#5a5266">Brussels</text>

  <circle cx="610" cy="180" r="9" fill="#a06f92"/>
  <text x="610" y="205" text-anchor="middle" font-size="12" fill="#2f2a3a" font-weight="bold">1955</text>
  <text x="610" y="220" text-anchor="middle" font-size="11" fill="#5a5266">Fernand Graindorge,</text>
  <text x="610" y="234" text-anchor="middle" font-size="11" fill="#5a5266">Liege (by this year)</text>

  <circle cx="790" cy="180" r="9" fill="#a06f92"/>
  <text x="790" y="205" text-anchor="middle" font-size="12" fill="#2f2a3a" font-weight="bold">1958</text>
  <text x="790" y="220" text-anchor="middle" font-size="11" fill="#5a5266">Feigen Gallery, Chicago,</text>
  <text x="790" y="234" text-anchor="middle" font-size="11" fill="#5a5266">then Richard S. Zeisler,</text>
  <text x="790" y="248" text-anchor="middle" font-size="11" fill="#5a5266">New York (September)</text>

  <circle cx="970" cy="180" r="9" fill="#8a5a7a"/>
  <text x="970" y="205" text-anchor="middle" font-size="12" fill="#2f2a3a" font-weight="bold">1998</text>
  <text x="970" y="220" text-anchor="middle" font-size="11" fill="#5a5266">MoMA acquires it,</text>
  <text x="970" y="234" text-anchor="middle" font-size="11" fill="#5a5266">Zeisler bequest</text>

  <text x="700" y="270" text-anchor="middle" font-size="11" font-style="italic" fill="#7a6b78">Five documented owners across 70 years. No public record 1928-1953 (spans the German occupation of Belgium, 1940-1944).</text>

  <!-- NGA track -->
  <text x="70" y="360" font-size="15" fill="#2f2a3a" font-weight="bold">National Gallery of Australia, Canberra</text>
  <text x="70" y="378" font-size="12" fill="#5a5266">(couple facing the viewer)</text>
  <line x1="220" y1="390" x2="1140" y2="390" stroke="#4a7a72" stroke-width="4" stroke-dasharray="2 10"/>
  <line x1="900" y1="390" x2="1140" y2="390" stroke="#4a7a72" stroke-width="4"/>

  <circle cx="250" cy="390" r="9" fill="#4a7a72"/>
  <text x="250" y="415" text-anchor="middle" font-size="12" fill="#2f2a3a" font-weight="bold">1928</text>
  <text x="250" y="430" text-anchor="middle" font-size="11" fill="#5a5266">Painted, Paris</text>

  <text x="580" y="415" text-anchor="middle" font-size="11" fill="#5a5266" font-style="italic">no owner in public gallery records for 62 years</text>

  <circle cx="970" cy="390" r="9" fill="#4a7a72"/>
  <text x="970" y="415" text-anchor="middle" font-size="12" fill="#2f2a3a" font-weight="bold">1990</text>
  <text x="970" y="430" text-anchor="middle" font-size="11" fill="#5a5266">Gallery purchases it</text>
  <text x="970" y="444" text-anchor="middle" font-size="11" fill="#5a5266">(accession 90.1583)</text>

  <text x="600" y="500" text-anchor="middle" font-size="12" fill="#5a5266" font-style="italic">Nearly identical canvases from the same year, painted the same idea two different ways,</text>
  <text x="600" y="520" text-anchor="middle" font-size="12" fill="#5a5266" font-style="italic">left two very different documentary trails behind them.</text>
</svg>
