<svg viewBox="0 0 1200 760" width="1200" height="760" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <radialGradient id="sphereGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e6c9a0"/>
      <stop offset="55%" stop-color="#a6733f"/>
      <stop offset="100%" stop-color="#4a3728"/>
    </radialGradient>
    <linearGradient id="valueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7f1e6"/>
      <stop offset="50%" stop-color="#9c6b4f"/>
      <stop offset="100%" stop-color="#2c1e14"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="#faf6f0"/>
  <text x="600" y="50" text-anchor="middle" font-size="26" fill="#4a3728" font-weight="bold">The Seven Elements of Art</text>
  <text x="600" y="78" text-anchor="middle" font-size="15" fill="#6d4f3a">The classroom checklist as it is taught today, one visual example per term</text>

  <!-- Row 1: LINE, SHAPE, FORM, SPACE -->
  <!-- Cell 1: LINE -->
  <g>
    <rect x="50" y="110" width="260" height="300" rx="10" fill="#fff8ef" stroke="#d9c7ae" stroke-width="1.5"/>
    <path d="M 80 260 C 130 160, 200 340, 280 190" fill="none" stroke="#6d4f3a" stroke-width="5" stroke-linecap="round"/>
    <text x="180" y="345" text-anchor="middle" font-size="18" fill="#4a3728" font-weight="bold">LINE</text>
    <text x="180" y="368" text-anchor="middle" font-size="12" fill="#7a6248">A mark tracing a path</text>
    <text x="180" y="384" text-anchor="middle" font-size="12" fill="#7a6248">between two points</text>
  </g>

  <!-- Cell 2: SHAPE -->
  <g>
    <rect x="330" y="110" width="260" height="300" rx="10" fill="#fff8ef" stroke="#d9c7ae" stroke-width="1.5"/>
    <polygon points="460,175 410,270 510,270" fill="#a6733f" stroke="#4a3728" stroke-width="2"/>
    <text x="460" y="345" text-anchor="middle" font-size="18" fill="#4a3728" font-weight="bold">SHAPE</text>
    <text x="460" y="368" text-anchor="middle" font-size="12" fill="#7a6248">A flat area enclosed</text>
    <text x="460" y="384" text-anchor="middle" font-size="12" fill="#7a6248">by a line, in 2D</text>
  </g>

  <!-- Cell 3: FORM -->
  <g>
    <rect x="610" y="110" width="260" height="300" rx="10" fill="#fff8ef" stroke="#d9c7ae" stroke-width="1.5"/>
    <circle cx="740" cy="225" r="60" fill="url(#sphereGrad)"/>
    <text x="740" y="345" text-anchor="middle" font-size="18" fill="#4a3728" font-weight="bold">FORM</text>
    <text x="740" y="368" text-anchor="middle" font-size="12" fill="#7a6248">The same shape given</text>
    <text x="740" y="384" text-anchor="middle" font-size="12" fill="#7a6248">volume, in 3D</text>
  </g>

  <!-- Cell 4: SPACE -->
  <g>
    <rect x="890" y="110" width="260" height="300" rx="10" fill="#fff8ef" stroke="#d9c7ae" stroke-width="1.5"/>
    <circle cx="965" cy="175" r="22" fill="#c7ab8a" opacity="0.55"/>
    <circle cx="1055" cy="255" r="48" fill="#6d4f3a"/>
    <text x="1020" y="345" text-anchor="middle" font-size="18" fill="#4a3728" font-weight="bold">SPACE</text>
    <text x="1020" y="368" text-anchor="middle" font-size="12" fill="#7a6248">Scale and placement</text>
    <text x="1020" y="384" text-anchor="middle" font-size="12" fill="#7a6248">read as near or far</text>
  </g>

  <!-- Row 2: VALUE, COLOR, TEXTURE -->
  <!-- Cell 5: VALUE -->
  <g>
    <rect x="190" y="430" width="260" height="300" rx="10" fill="#fff8ef" stroke="#d9c7ae" stroke-width="1.5"/>
    <rect x="230" y="500" width="180" height="50" fill="url(#valueGrad)" stroke="#4a3728" stroke-width="1"/>
    <text x="320" y="665" text-anchor="middle" font-size="18" fill="#4a3728" font-weight="bold">VALUE</text>
    <text x="320" y="688" text-anchor="middle" font-size="12" fill="#7a6248">The lightness or</text>
    <text x="320" y="704" text-anchor="middle" font-size="12" fill="#7a6248">darkness of a tone</text>
  </g>

  <!-- Cell 6: COLOR -->
  <g>
    <rect x="470" y="430" width="260" height="300" rx="10" fill="#fff8ef" stroke="#d9c7ae" stroke-width="1.5"/>
    <circle cx="555" cy="500" r="24" fill="#b3552e"/>
    <circle cx="605" cy="500" r="24" fill="#c9a227"/>
    <circle cx="655" cy="500" r="24" fill="#6b7a3a"/>
    <circle cx="555" cy="550" r="24" fill="#3f6e6a"/>
    <circle cx="605" cy="550" r="24" fill="#3f5a75"/>
    <circle cx="655" cy="550" r="24" fill="#6a3f5a"/>
    <text x="600" y="665" text-anchor="middle" font-size="18" fill="#4a3728" font-weight="bold">COLOR</text>
    <text x="600" y="688" text-anchor="middle" font-size="12" fill="#7a6248">Hue, described by</text>
    <text x="600" y="704" text-anchor="middle" font-size="12" fill="#7a6248">wavelength of light</text>
  </g>

  <!-- Cell 7: TEXTURE -->
  <g>
    <rect x="750" y="430" width="260" height="300" rx="10" fill="#fff8ef" stroke="#d9c7ae" stroke-width="1.5"/>
    <g stroke="#8a5a34" stroke-width="2">
      <line x1="835" y1="475" x2="885" y2="525"/>
      <line x1="855" y1="475" x2="905" y2="525"/>
      <line x1="875" y1="475" x2="925" y2="525"/>
      <line x1="835" y1="495" x2="865" y2="525"/>
      <line x1="895" y1="475" x2="925" y2="505"/>
      <line x1="885" y1="475" x2="835" y2="525"/>
      <line x1="905" y1="475" x2="855" y2="525"/>
      <line x1="925" y1="475" x2="875" y2="525"/>
      <line x1="925" y1="495" x2="895" y2="525"/>
      <line x1="865" y1="475" x2="835" y2="505"/>
    </g>
    <rect x="835" y="475" width="90" height="50" fill="none" stroke="#4a3728" stroke-width="1.5"/>
    <text x="880" y="665" text-anchor="middle" font-size="18" fill="#4a3728" font-weight="bold">TEXTURE</text>
    <text x="880" y="688" text-anchor="middle" font-size="12" fill="#7a6248">How a surface looks</text>
    <text x="880" y="704" text-anchor="middle" font-size="12" fill="#7a6248">or feels to the touch</text>
  </g>

  <text x="600" y="748" text-anchor="middle" font-size="12" fill="#7a6248" font-style="italic">Some art departments add mark making and materiality as an eighth and ninth term; the count is not fixed.</text>
</svg>
