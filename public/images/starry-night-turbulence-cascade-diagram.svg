<svg viewBox="0 0 1200 640" width="1200" height="640" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1200" height="640" fill="#faf6f0"/>
  <text x="600" y="46" text-anchor="middle" font-size="24" fill="#4a3728" font-weight="bold">"Big Whirls Have Little Whirls"</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#6d4f3a">Lewis Fry Richardson's 1922 description of a turbulence cascade, the pattern physicists later tested against the sky in The Starry Night</text>

  <!-- Cascade: one large eddy breaking into progressively smaller ones -->
  <g>
    <circle cx="290" cy="330" r="150" fill="none" stroke="#8a5a34" stroke-width="4"/>
    <text x="290" y="500" text-anchor="middle" font-size="13" fill="#4a3728" font-weight="bold">Largest whirl</text>
    <text x="290" y="518" text-anchor="middle" font-size="11" fill="#7a6248">feeds its motion into smaller ones</text>
  </g>

  <path d="M460,330 L560,330" stroke="#4a3728" stroke-width="3" marker-end="url(#arrow2)"/>

  <g>
    <circle cx="660" cy="290" r="80" fill="none" stroke="#a6733f" stroke-width="4"/>
    <circle cx="660" cy="290" r="80" fill="none" stroke="#a6733f" stroke-width="0"/>
    <circle cx="700" cy="340" r="45" fill="none" stroke="#a6733f" stroke-width="3.5"/>
    <text x="660" y="500" text-anchor="middle" font-size="13" fill="#4a3728" font-weight="bold">Mid-sized whirls</text>
  </g>

  <path d="M800,300 L870,290" stroke="#4a3728" stroke-width="3" marker-end="url(#arrow2)"/>

  <g>
    <circle cx="950" cy="270" r="30" fill="none" stroke="#6d4f3a" stroke-width="3"/>
    <circle cx="1000" cy="310" r="18" fill="none" stroke="#6d4f3a" stroke-width="2.5"/>
    <circle cx="965" cy="330" r="10" fill="none" stroke="#6d4f3a" stroke-width="2"/>
    <text x="975" y="500" text-anchor="middle" font-size="13" fill="#4a3728" font-weight="bold">Smallest whirls</text>
    <text x="975" y="518" text-anchor="middle" font-size="11" fill="#7a6248">energy dissipates to heat</text>
  </g>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4a3728"/>
    </marker>
  </defs>

  <text x="600" y="575" text-anchor="middle" font-size="13" fill="#4a3728" font-style="italic">"Big whirls have little whirls that feed on their velocity, and little whirls have</text>
  <text x="600" y="595" text-anchor="middle" font-size="13" fill="#4a3728" font-style="italic">lesser whirls and so on to viscosity." — Lewis Fry Richardson, 1922</text>
  <text x="600" y="622" text-anchor="middle" font-size="11" fill="#7a6248">A 2024 study found this cascade in the full sky of The Starry Night follows Kolmogorov's −5/3 power law</text>
</svg>
