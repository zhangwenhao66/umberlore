<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="640" height="460" fill="#f4ede1"/>

  <!-- torso outline -->
  <ellipse cx="320" cy="150" rx="46" ry="54" fill="none" stroke="#4a3626" stroke-width="2.5"/>
  <path d="M 264 195 Q 320 210 376 195 L 392 360 Q 320 385 248 360 Z" fill="#efe3d0" stroke="#4a3626" stroke-width="2.5"/>

  <!-- fractured Ionic column standing in for the spine -->
  <g stroke="#8a5a34" stroke-width="3" fill="#dcc9a8">
    <rect x="308" y="200" width="24" height="34" rx="2"/>
    <rect x="304" y="238" width="32" height="6"/>
    <rect x="311" y="248" width="18" height="30" rx="2" transform="rotate(-4 320 263)"/>
    <rect x="303" y="286" width="34" height="6" transform="rotate(3 320 289)"/>
    <rect x="309" y="298" width="22" height="32" rx="2" transform="rotate(5 320 314)"/>
    <rect x="306" y="336" width="30" height="6" transform="rotate(-2 320 339)"/>
    <rect x="312" y="346" width="16" height="28" rx="2"/>
  </g>

  <!-- nails piercing the body, radiating outward -->
  <g stroke="#7a2f1f" stroke-width="2.5">
    <line x1="292" y1="130" x2="264" y2="112"/>
    <line x1="348" y1="130" x2="376" y2="112"/>
    <line x1="278" y1="220" x2="240" y2="214"/>
    <line x1="362" y1="220" x2="400" y2="214"/>
    <line x1="270" y1="270" x2="230" y2="272"/>
    <line x1="370" y1="270" x2="410" y2="272"/>
    <line x1="278" y1="320" x2="244" y2="330"/>
    <line x1="362" y1="320" x2="396" y2="330"/>
  </g>
  <g fill="#7a2f1f">
    <circle cx="264" cy="112" r="3"/>
    <circle cx="376" cy="112" r="3"/>
    <circle cx="240" cy="214" r="3"/>
    <circle cx="400" cy="214" r="3"/>
    <circle cx="230" cy="272" r="3"/>
    <circle cx="410" cy="272" r="3"/>
    <circle cx="244" cy="330" r="3"/>
    <circle cx="396" cy="330" r="3"/>
  </g>

  <!-- white drapery at the hips -->
  <path d="M 260 330 Q 320 350 380 330 L 386 365 Q 320 382 254 365 Z" fill="#ffffff" stroke="#4a3626" stroke-width="2" opacity="0.9"/>

  <!-- barren cracked landscape line -->
  <path d="M 20 420 Q 160 405 320 415 T 620 408" fill="none" stroke="#7a6248" stroke-width="2"/>
  <path d="M 120 420 L 132 440 M 300 414 L 292 434 M 470 411 L 480 432" stroke="#7a6248" stroke-width="1.5"/>

  <!-- labels -->
  <g font-size="15" fill="#3a2c1e">
    <text x="410" y="150">fractured Ionic column</text>
    <text x="410" y="168" font-size="12" fill="#6b5844">stands in for the spine</text>

    <text x="420" y="220">nails</text>
    <text x="420" y="236" font-size="12" fill="#6b5844">Saint Sebastian / crucifixion imagery</text>

    <text x="60" y="352" text-anchor="start">white drapery</text>
    <text x="60" y="368" font-size="12" fill="#6b5844">echoes a loincloth</text>

    <text x="440" y="440" font-size="12" fill="#6b5844">barren, fissured landscape</text>
  </g>

  <text x="320" y="30" text-anchor="middle" font-size="17" fill="#2e2216">The Broken Column (1944): composition key</text>
  <text x="320" y="450" text-anchor="middle" font-size="11" fill="#7a6248">Diagram by UmberLore. Not a reproduction of Kahlo's painting, which remains in copyright until 2054.</text>
</svg>
