<svg viewBox="0 0 1200 620" width="1200" height="620" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1200" height="620" fill="#faf6f0"/>
  <text x="600" y="50" text-anchor="middle" font-size="26" fill="#4a3728" font-weight="bold">A Camera Skips One Generation, Then Returns Twice</text>
  <text x="600" y="78" text-anchor="middle" font-size="15" fill="#6d4f3a">Four generations of one Mexico City family, alternating who holds the camera and who sits for it</text>

  <line x1="80" y1="330" x2="1120" y2="330" stroke="#8a5a34" stroke-width="4"/>

  <!-- Gen 1: Guillermo -->
  <circle cx="150" cy="330" r="14" fill="#8a5a34"/>
  <text x="150" y="270" text-anchor="middle" font-size="15" fill="#4a3728" font-weight="bold">Guillermo Kahlo</text>
  <text x="150" y="290" text-anchor="middle" font-size="12" fill="#7a6248">1871-1941</text>
  <text x="150" y="308" text-anchor="middle" font-size="12" fill="#7a6248">photographer</text>
  <text x="150" y="368" text-anchor="middle" font-size="13" fill="#4a3728">Commercial photographer;</text>
  <text x="150" y="386" text-anchor="middle" font-size="13" fill="#4a3728">took the 1916 portrait</text>
  <text x="150" y="404" text-anchor="middle" font-size="13" fill="#4a3728">of his four daughters</text>
  <text x="150" y="422" text-anchor="middle" font-size="12" fill="#7a6248">above, including Cristina</text>

  <path d="M 220 330 L 380 330" stroke="#b08050" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="300" y="320" text-anchor="middle" font-size="11" fill="#a6733f" font-style="italic">daughter</text>

  <!-- Gen 2: Cristina (historical) -->
  <circle cx="450" cy="330" r="14" fill="#a6733f"/>
  <text x="450" y="270" text-anchor="middle" font-size="15" fill="#4a3728" font-weight="bold">Cristina Kahlo</text>
  <text x="450" y="290" text-anchor="middle" font-size="12" fill="#7a6248">1908-1964</text>
  <text x="450" y="308" text-anchor="middle" font-size="12" fill="#7a6248">painted and muraled, not behind a camera</text>
  <text x="450" y="368" text-anchor="middle" font-size="13" fill="#4a3728">Painted by Frida (1928,</text>
  <text x="450" y="386" text-anchor="middle" font-size="13" fill="#4a3728">1937) and muraled by</text>
  <text x="450" y="404" text-anchor="middle" font-size="13" fill="#4a3728">Rivera (1934-35, Ministry</text>
  <text x="450" y="422" text-anchor="middle" font-size="12" fill="#7a6248">of Health); mother of Antonio</text>

  <path d="M 520 330 L 680 330" stroke="#b08050" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="600" y="320" text-anchor="middle" font-size="11" fill="#a6733f" font-style="italic">son</text>

  <!-- Gen 3: Antonio -->
  <circle cx="750" cy="330" r="14" fill="#6d4f3a"/>
  <text x="750" y="270" text-anchor="middle" font-size="15" fill="#4a3728" font-weight="bold">Antonio Kahlo</text>
  <text x="750" y="290" text-anchor="middle" font-size="12" fill="#7a6248">amateur photographer</text>
  <text x="750" y="368" text-anchor="middle" font-size="13" fill="#4a3728">Cristina's son; kept a</text>
  <text x="750" y="386" text-anchor="middle" font-size="13" fill="#4a3728">home darkroom; taught his</text>
  <text x="750" y="404" text-anchor="middle" font-size="13" fill="#4a3728">daughter to develop prints</text>
  <text x="750" y="422" text-anchor="middle" font-size="12" fill="#7a6248">before dying at 42</text>

  <path d="M 820 330 L 980 330" stroke="#b08050" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="900" y="320" text-anchor="middle" font-size="11" fill="#a6733f" font-style="italic">daughter</text>

  <!-- Gen 4: modern Cristina -->
  <circle cx="1050" cy="330" r="14" fill="#7a6248"/>
  <text x="1050" y="270" text-anchor="middle" font-size="15" fill="#4a3728" font-weight="bold">Cristina Kahlo</text>
  <text x="1050" y="290" text-anchor="middle" font-size="12" fill="#7a6248">living, photographer</text>
  <text x="1050" y="308" text-anchor="middle" font-size="12" fill="#7a6248">named for her grandmother</text>
  <text x="1050" y="368" text-anchor="middle" font-size="13" fill="#4a3728">Antonio's daughter;</text>
  <text x="1050" y="386" text-anchor="middle" font-size="13" fill="#4a3728">35-year photography</text>
  <text x="1050" y="404" text-anchor="middle" font-size="13" fill="#4a3728">career; consulted on the</text>
  <text x="1050" y="422" text-anchor="middle" font-size="12" fill="#7a6248">2024 documentary Frida</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#a6733f"/>
    </marker>
  </defs>

  <text x="600" y="500" text-anchor="middle" font-size="12" fill="#7a6248" font-style="italic">Two of the four generations photographed; the other two, joined by marriage and by paint rather than by a lens, were photographed and painted instead.</text>
  <text x="600" y="520" text-anchor="middle" font-size="12" fill="#7a6248" font-style="italic">The name Cristina Kahlo now belongs to two different working artists in the same family, born roughly half a century apart.</text>
</svg>
