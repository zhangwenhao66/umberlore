<svg viewBox="0 0 1200 500" width="1200" height="500" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1200" height="500" fill="#faf6f0"/>
  <text x="600" y="46" text-anchor="middle" font-size="24" fill="#4a3728" font-weight="bold">Where the Weight Sits</text>
  <text x="600" y="74" text-anchor="middle" font-size="14" fill="#6d4f3a">Both figures stand. Only one carries its weight on a single leg, and that is what tilts the two lines apart.</text>

  <!-- Left panel: frontal stance -->
  <g>
    <rect x="40" y="100" width="500" height="360" rx="10" fill="#fff8ef" stroke="#d9c7ae" stroke-width="1.5"/>
    <text x="290" y="132" text-anchor="middle" font-size="16" fill="#4a3728" font-weight="bold">Frontal stance</text>
    <text x="290" y="154" text-anchor="middle" font-size="12.5" fill="#8a6a4f">weight on both legs</text>

    <circle cx="290" cy="216" r="24" fill="#4a3728"/>
    <line x1="240" y1="262" x2="340" y2="262" stroke="#4a3728" stroke-width="6" stroke-linecap="round"/>
    <line x1="290" y1="262" x2="290" y2="342" stroke="#6d4f3a" stroke-width="6" stroke-linecap="round"/>
    <line x1="243" y1="342" x2="337" y2="342" stroke="#4a3728" stroke-width="6" stroke-linecap="round"/>
    <line x1="265" y1="342" x2="265" y2="420" stroke="#6d4f3a" stroke-width="6" stroke-linecap="round"/>
    <line x1="315" y1="342" x2="315" y2="420" stroke="#6d4f3a" stroke-width="6" stroke-linecap="round"/>

    <text x="240" y="243" text-anchor="end" font-size="12" fill="#8a6a4f">shoulders level</text>
    <text x="240" y="368" text-anchor="end" font-size="12" fill="#8a6a4f">hips level</text>
    <text x="290" y="446" text-anchor="middle" font-size="12" fill="#8a6a4f">the two lines stay parallel</text>
  </g>

  <!-- Right panel: contrapposto -->
  <g>
    <rect x="660" y="100" width="500" height="360" rx="10" fill="#fff8ef" stroke="#d9c7ae" stroke-width="1.5"/>
    <text x="910" y="132" text-anchor="middle" font-size="16" fill="#4a3728" font-weight="bold">Contrapposto</text>
    <text x="910" y="154" text-anchor="middle" font-size="12.5" fill="#8a6a4f">weight on one leg</text>

    <circle cx="905" cy="214" r="24" fill="#4a3728"/>
    <!-- shoulder line: low on the weighted side (viewer left), high on the free side -->
    <line x1="818" y1="274" x2="990" y2="256" stroke="#4a3728" stroke-width="6" stroke-linecap="round"/>
    <line x1="905" y1="266" x2="905" y2="342" stroke="#6d4f3a" stroke-width="6" stroke-linecap="round"/>
    <!-- hip line: high on the weighted side, low on the free side -->
    <line x1="806" y1="336" x2="1000" y2="356" stroke="#a6733f" stroke-width="6" stroke-linecap="round"/>
    <!-- weighted leg: straight -->
    <line x1="812" y1="338" x2="806" y2="424" stroke="#4a3728" stroke-width="7" stroke-linecap="round"/>
    <!-- free leg: bent -->
    <line x1="994" y1="354" x2="1024" y2="392" stroke="#6d4f3a" stroke-width="6" stroke-linecap="round"/>
    <line x1="1024" y1="392" x2="980" y2="424" stroke="#6d4f3a" stroke-width="6" stroke-linecap="round"/>

    <text x="818" y="256" text-anchor="end" font-size="12" fill="#8a6a4f">shoulder drops</text>
    <text x="806" y="326" text-anchor="end" font-size="12" fill="#a6733f">hip rises</text>
    <text x="770" y="424" text-anchor="end" font-size="12" fill="#4a3728">weighted leg</text>
    <text x="1042" y="424" font-size="12" fill="#6d4f3a">free leg</text>
    <text x="910" y="446" text-anchor="middle" font-size="12" fill="#8a6a4f">the two lines tilt against each other</text>
  </g>

  <text x="600" y="484" text-anchor="middle" font-size="11.5" fill="#8a6a4f">Schematic. The weight-bearing leg stays straight; the free leg bends and carries nothing.</text>
</svg>
