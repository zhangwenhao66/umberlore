<svg viewBox="0 0 1200 620" width="1200" height="620" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1200" height="620" fill="#faf6f0"/>
  <text x="600" y="50" text-anchor="middle" font-size="26" fill="#4a3728" font-weight="bold">The $9.85M Listing vs. the Confirmed Sales</text>
  <text x="600" y="78" text-anchor="middle" font-size="15" fill="#6d4f3a">One painting was asked at a price; four others actually changed hands</text>

  <!-- 2023 listing, drawn as a separate dashed marker above the confirmed-sale line -->
  <line x1="120" y1="180" x2="120" y2="330" stroke="#b08968" stroke-width="2" stroke-dasharray="5,5"/>
  <circle cx="120" cy="180" r="12" fill="#ffffff" stroke="#b08968" stroke-width="3"/>
  <text x="120" y="140" text-anchor="middle" font-size="19" fill="#4a3728" font-weight="bold">Sep 2023</text>
  <text x="120" y="162" text-anchor="middle" font-size="12" fill="#a4785a" font-style="italic">asking price, not a sale</text>
  <text x="270" y="190" font-size="13" fill="#4a3728">"A Walk in the Woods," the first-ever TV painting, listed by a</text>
  <text x="270" y="208" font-size="13" fill="#4a3728">Minneapolis gallery at $9.85 million. The owner said he might</text>
  <text x="270" y="226" font-size="13" fill="#4a3728">not sell soon &#8212; no sale has ever been confirmed.</text>

  <!-- Confirmed-sale timeline -->
  <line x1="90" y1="420" x2="1110" y2="420" stroke="#8a5a34" stroke-width="4"/>

  <!-- Aug 2025 -->
  <circle cx="180" cy="420" r="12" fill="#8a5a34"/>
  <text x="180" y="370" text-anchor="middle" font-size="18" fill="#4a3728" font-weight="bold">Aug 2025</text>
  <text x="180" y="460" text-anchor="middle" font-size="12" fill="#4a3728">"Lake Below</text>
  <text x="180" y="476" text-anchor="middle" font-size="12" fill="#4a3728">Snow-Capped Peaks"</text>
  <text x="180" y="494" text-anchor="middle" font-size="13" fill="#7a6248" font-weight="bold">$114,800</text>
  <text x="180" y="510" text-anchor="middle" font-size="11" fill="#7a6248">Bonhams, online</text>

  <!-- Nov 2025 -->
  <circle cx="500" cy="420" r="14" fill="#a6733f"/>
  <text x="500" y="370" text-anchor="middle" font-size="18" fill="#4a3728" font-weight="bold">Nov 2025</text>
  <text x="500" y="460" text-anchor="middle" font-size="12" fill="#4a3728">"Cabin at Sunset"</text>
  <text x="500" y="476" text-anchor="middle" font-size="12" fill="#4a3728">John Oliver benefit auction</text>
  <text x="500" y="494" text-anchor="middle" font-size="14" fill="#7a6248" font-weight="bold">$1,044,000</text>
  <text x="500" y="510" text-anchor="middle" font-size="11" fill="#7a6248">highest confirmed sale</text>

  <!-- Jan 2026 -->
  <circle cx="820" cy="420" r="12" fill="#6d4f3a"/>
  <text x="820" y="370" text-anchor="middle" font-size="18" fill="#4a3728" font-weight="bold">Jan 2026</text>
  <text x="820" y="460" text-anchor="middle" font-size="12" fill="#4a3728">"Change of Seasons"</text>
  <text x="820" y="476" text-anchor="middle" font-size="12" fill="#4a3728">Bonhams Skinner</text>
  <text x="820" y="494" text-anchor="middle" font-size="13" fill="#7a6248" font-weight="bold">$787,900</text>
  <text x="820" y="510" text-anchor="middle" font-size="11" fill="#7a6248">traditional auction house</text>

  <text x="600" y="570" text-anchor="middle" font-size="12" fill="#7a6248" font-style="italic">The John Oliver sale was a celebrity charity benefit, not a standard auction house; some outlets called the January 2026 Bonhams Skinner result a "record" too, meaning the record outside that one benefit sale.</text>
  <text x="600" y="590" text-anchor="middle" font-size="11" fill="#7a6248" font-style="italic">All three 2025-2026 sales raised money for public media. No individually famous painting from the original 1983-1994 broadcast has a confirmed sale above $1.044 million.</text>
</svg>
