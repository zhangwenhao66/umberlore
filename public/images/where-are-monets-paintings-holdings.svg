<svg viewBox="0 0 1200 640" width="1200" height="640" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Horizontal bar chart of where the 1,824 paintings in Wikipedia's list of Monet paintings are: 954 in private collections, then 73 at the Musée d'Orsay, 71 at the Musée Marmottan Monet, 39 at the Metropolitan Museum of Art, 37 in Boston, 31 in Chicago, 26 at the National Gallery of Art in Washington, 22 in Philadelphia, and 17 unknown or destroyed.">
<rect width="1200" height="640" fill="#faf6f0"/>
